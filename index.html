<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras: Python & Pygame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sopa de Letras: Python & Pygame</h1>
            <p>Arrastra el cursor sobre las letras para encontrar los términos ocultos.</p>
        </header>

        <main class="game-area">
            <div id="grid" class="grid"></div>
            
            <aside class="sidebar">
                <h2>Palabras a encontrar</h2>
                <ul id="word-list" class="word-list"></ul>
                <button id="reset-btn" class="btn">Nuevo Tablero</button>
                <div id="status-message" class="status-message"></div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
